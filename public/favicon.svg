  <path d="M 64 38 H 48 C 41.37 38 36 43.37 36 50 V 66" stroke="url(#favAppGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 136 38 H 152 C 158.63 38 164 43.37 164 50 V 66" stroke="url(#favAppGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 36 134 V 150 C 36 156.63 41.37 162 48 162 H 66" stroke="url(#favAppGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Face Silhouette -->
  <path d="M 58 84 C 58 56 76 44 100 44 C 124 44 142 56 142 84 C 146 84 149 87 149 92 C 149 98 146 102 142 103 L 142 110 C 142 116 138 122 133 126 L 126 138 C 118 152 108 158 100 158 C 92 158 82 152 74 138 L 67 126 C 62 122 58 116 58 110 L 58 103 C 54 102 51 98 51 92 C 51 87 54 84 58 84 Z" fill="none" stroke="url(#favAppGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 58 90 C 51 90 49 95 49 100 C 49 106 53 110 58 110" stroke="url(#favAppGrad)" stroke-width="6" stroke-linecap="round" />
  <path d="M 142 90 C 149 90 151 95 151 100 C 151 106 147 110 142 110" stroke="url(#favAppGrad)" stroke-width="6" stroke-linecap="round" />

  <!-- Laser Scan Beam -->
  <line x1="30" y1="108" x2="170" y2="108" stroke="url(#favLaserGrad)" stroke-width="12" stroke-linecap="round" opacity="0.85" />
  <line x1="30" y1="108" x2="170" y2="108" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />

  <!-- 'BET' Badge -->
  <circle cx="145" cy="145" r="24" fill="#0C0728" stroke="url(#favBadgeGrad)" stroke-width="5" />
  <text x="145" y="152" fill="#FFFFFF" font-size="15" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle" letter-spacing="0.5px">BET</text>
